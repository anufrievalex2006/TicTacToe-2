rules:
  - id: hardcoded-jwt-secret
    pattern: |
      @Value("${jwt.secret}")
      private String $SECRET;
    message: >
      JWT secret loaded via @Value. Ensure the value in application.properties
      is not hardcoded and uses environment variables in production.
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A04:2025 - Cryptographic Failures"
      cwe: "CWE-798: Use of Hard-coded Credentials"